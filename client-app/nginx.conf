server {
    listen 80;
    root /usr/share/nginx/html;

    # Same role as the Vite dev proxy: the browser only talks to this origin, so no CORS is needed
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name, so they can be cached for a long time
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate the page itself, so a new build is picked up right away
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache";
    }

    # Vue Router uses real paths (/requests), so unknown paths fall back to index.html
    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
