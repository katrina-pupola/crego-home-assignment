spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/crego
    username: crego
    password: crego
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    # Mailpit by default: catches every email and shows it at http://localhost:8025
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
server:
  port: 8080
app:
  jwt:
    # Dev default; set JWT_SECRET in any real environment (min. 32 characters for HS256)
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: 1h
  mail:
    from: ${MAIL_FROM:no-reply@payment-methods.test}
    # Links in emails point here
    client-app-url: ${CLIENT_APP_URL:http://127.0.0.1:5173}
    verification-ttl: 24h
